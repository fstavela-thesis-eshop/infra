services:
  zookeeper:
    image: docker.io/confluentinc/cp-zookeeper:7.9.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: docker.io/confluentinc/cp-kafka:7.9.0
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper

  kafka-init:
    image: docker.io/confluentinc/cp-kafka:7.9.0
    depends_on:
      - kafka
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      echo 'Waiting for Kafka to be ready...';
      sleep 10;
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic orders --replication-factor 1 --partitions 1;
      "

  api_gateway:
    image: docker.io/library/nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - users
      - inventory
      - orders
      - notifications
      - swagger_ui

  swagger_ui:
    image: docker.io/swaggerapi/swagger-ui
    environment:
      API_URLS: '[{"url": "/users/openapi.json", "name": "Users"}, {"url": "/inventory/openapi.json", "name": "Inventory"}, {"url": "/orders/openapi.json", "name": "Orders"}, {"url": "/notifications/openapi.json", "name": "Notifications"}]'
    depends_on:
      - users
      - inventory
      - orders
      - notifications

  users_db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users_db
    healthcheck:
      test: "pg_isready -h users_db"
      interval: 1s
      timeout: 5s
      retries: 10

  users:
    build: ../users
    environment:
      DATABASE_URL: postgresql://postgres:postgres@users_db:5432/users_db
    depends_on:
      users_db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ../users/src
          target: /users/src

  inventory_db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventory_db
    healthcheck:
      test: "pg_isready -h inventory_db"
      interval: 1s
      timeout: 5s
      retries: 10

  inventory:
    build: ../inventory
    environment:
      DATABASE_URL: postgresql://postgres:postgres@inventory_db:5432/inventory_db
    depends_on:
      inventory_db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ../inventory/src
          target: /inventory/src

  orders_db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders_db
    healthcheck:
      test: "pg_isready -h orders_db"
      interval: 1s
      timeout: 5s
      retries: 10

  orders:
    build: ../orders
    environment:
      DATABASE_URL: postgresql://postgres:postgres@orders_db:5432/orders_db
      INVENTORY_BASE_URL: http://inventory:8000
      KAFKA_SERVER: "kafka:9092"
      KAFKA_ORDERS_TOPIC: orders
    depends_on:
      orders_db:
        condition: service_healthy
      inventory:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    develop:
      watch:
        - action: sync
          path: ../orders/src
          target: /orders/src

  notifications_db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notifications_db
    healthcheck:
      test: "pg_isready -h notifications_db"
      interval: 1s
      timeout: 5s
      retries: 10

  notifications:
    build: ../notifications
    environment:
      DATABASE_URL: postgresql://postgres:postgres@notifications_db:5432/notifications_db
    depends_on:
      notifications_db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ../notifications/src
          target: /notifications/src

  notifications-kafka-consumer:
    build: ../notifications
    command: sh -c "cd src && python -m kafka.consumer"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@notifications_db:5432/notifications_db
      KAFKA_SERVER: "kafka:9092"
      KAFKA_ORDERS_TOPIC: orders
    depends_on:
      notifications_db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

